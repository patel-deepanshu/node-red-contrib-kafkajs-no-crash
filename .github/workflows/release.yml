name: Release

# Publishes to npm when a GitHub release is published (tag vX.Y.Z matching package.json).
# Authentication: npm "trusted publishing" (OIDC, no token stored in GitHub) once it is configured for this package
# on npmjs.com; until then, an automation token in the NPM_TOKEN repository secret. See docs/RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@11
      - run: npm ci
      - name: The release tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: No known vulnerability in the runtime dependencies
        run: npm run audit:runtime
      - name: Registry signatures of the installed packages
        run: npm audit signatures
      - name: Skip a version that is already on npm (e.g. the first release, published by hand)
        id: exists
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly runs lint and the full test suite before anything is uploaded
      - run: npm publish --provenance --access public
        if: steps.exists.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
